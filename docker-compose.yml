services:

  mongodb:
    image: mongo:8
    container_name: careertrack-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db


  backend:
    build:
      context: ./backend

    container_name: careertrack-backend

    restart: unless-stopped

    depends_on:
      - mongodb

    ports:
      - "8000:8000"

    environment:
      MONGODB_URL: mongodb://mongodb:27017
      DATABASE_NAME: careertrack
      ENVIRONMENT: production
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      CORS_ORIGINS: http://localhost


  frontend:
    build:
      context: ./frontend

    container_name: careertrack-frontend

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "80:80"


volumes:
  mongodb_data: